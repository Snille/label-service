name: label-service
services:
  cups:
    image: label-service-cups:local
    build: ./cups
    init: true
    environment:
      CUPS_QUEUE: ${CUPS_QUEUE:-DYMO_5XL}
      PRINTER_MODEL: ${PRINTER_MODEL:-lw5xl}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      PRINTER_URI: ${PRINTER_URI:-}
    volumes:
      # Keeps CUPS job numbers and job history across container updates.
      - cups-spool:/var/spool/cups
      - cups-cache:/var/cache/cups
      # The queues of printers added on the admin page, written by the api.
      - queues:/queues:ro
    restart: unless-stopped
  api:
    image: label-service:local
    build: .
    depends_on: [cups]
    ports:
      - "127.0.0.1:${LABEL_PORT:-3230}:3230"
    environment:
      LABEL_ADMIN_KEY: ${LABEL_ADMIN_KEY:?Set an admin key}
      LABEL_CLIENT_KEYS: ${LABEL_CLIENT_KEYS:-}
      LABEL_CLIENT_ROLES: ${LABEL_CLIENT_ROLES:-}
      LABEL_ALLOWED_ORIGINS: ${LABEL_ALLOWED_ORIGINS:-}
      CUPS_URL: http://cups:631
      CUPS_QUEUE: ${CUPS_QUEUE:-DYMO_5XL}
      PRINTER_MODEL: ${PRINTER_MODEL:-lw5xl}
      PRINTER_NAME: ${PRINTER_NAME:-}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      # Date objects print in this time zone.
      TZ: ${TZ:-Europe/Stockholm}
      LABEL_QUEUES_FILE: /queues/queues.txt
    volumes:
      - api-data:/data
      - queues:/queues
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  cups-spool:
  cups-cache:
  api-data:
  queues:
