# Portainer stack. Images default to the published release; set LABEL_API_IMAGE / LABEL_CUPS_IMAGE to pin another tag or digest.
name: label-service
services:
  cups:
    image: ${LABEL_CUPS_IMAGE:-mrsnille/label-service-cups:0.11.0}
    init: true
    environment:
      CUPS_QUEUE: ${CUPS_QUEUE:-DYMO_5XL}
      PRINTER_MODEL: ${PRINTER_MODEL:-lw5xl}
      PRINTER_HOST: ${PRINTER_HOST:?Set the printer address}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    volumes:
      - cups-spool:/var/spool/cups
      - cups-cache:/var/cache/cups
    restart: unless-stopped
  api:
    image: ${LABEL_API_IMAGE:-mrsnille/label-service:0.11.0}
    depends_on: [cups]
    ports:
      # Publish on the LAN only; never forward this port from the internet.
      - "${LABEL_BIND:-0.0.0.0}:${LABEL_PORT:-3230}:3230"
    environment:
      LABEL_ADMIN_KEY: ${LABEL_ADMIN_KEY:?Set an admin key}
      LABEL_CLIENT_KEYS: ${LABEL_CLIENT_KEYS:?Set one key per client system}
      LABEL_CLIENT_ROLES: ${LABEL_CLIENT_ROLES:-}
      LABEL_ALLOWED_ORIGINS: ${LABEL_ALLOWED_ORIGINS:-}
      CUPS_URL: http://cups:631
      CUPS_QUEUE: ${CUPS_QUEUE:-DYMO_5XL}
      PRINTER_MODEL: ${PRINTER_MODEL:-lw5xl}
      PRINTER_NAME: ${PRINTER_NAME:-}
      PRINTER_HOST: ${PRINTER_HOST}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      # Date objects print in this time zone.
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - api-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
  # Label Studio, the template designer (separate repository). It calls the API over the stack network with its own
  # client key, so add studio=<key> to LABEL_CLIENT_KEYS and studio=designer to LABEL_CLIENT_ROLES.
  studio:
    image: ${LABEL_STUDIO_IMAGE:-mrsnille/label-studio:0.9.0}
    depends_on: [api]
    ports:
      # Publish on the LAN only; never forward this port from the internet.
      - "${STUDIO_BIND:-0.0.0.0}:${STUDIO_PORT:-3231}:3231"
    environment:
      LABEL_SERVICE_URL: http://api:3230
    restart: unless-stopped
volumes:
  cups-spool:
  cups-cache:
  api-data:
